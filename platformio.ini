; ROmBA - control web con ESP32 (proyecto independiente del firmware micro-ROS)
;
;   pio run -e esp32dev -t upload -t monitor      ESP32 DevKit V1 (WROOM-32)
;   pio run -e esp32s3  -t upload -t monitor      ESP32-S3 DevKitC-1
;
; Después de subirlo, conéctate a la red WiFi "ROmBA" (clave: romba1234)
; y abre http://192.168.4.1
[platformio]
default_envs = esp32dev

[env]
; espressif32 6.x = core Arduino 2.0.x (el código también compila con core 3.x)
platform = espressif32 @ 6.9.0
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; Mete web/index.html dentro del firmware antes de compilar
extra_scripts = pre:tools/embed_web.py
build_flags =
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    ESP32Async/AsyncTCP @ ^3.3.2
    ESP32Async/ESPAsyncWebServer @ ^3.6.0
    bblanchon/ArduinoJson @ ^7.2.0

[env:esp32dev]
board = esp32dev

[env:esp32s3]
board = esp32-s3-devkitc-1
